# One host per example in host_vars/. Each group is only a label for
# running part of the fleet (e.g. --limit dns_resolvers); the role picks
# what each host does from its host_vars.

[dns_authoritative]
dns-master-01.example.internal ansible_host=10.0.1.10
dns-slave-01.example.internal ansible_host=10.0.1.11
dns-edge-01.example.internal ansible_host=10.0.1.12

[dns_resolvers]
dns-cache-01.example.internal ansible_host=10.0.2.11
dns-recursive-01.example.internal ansible_host=10.0.2.10
dns-resolver-02.example.internal ansible_host=10.20.1.53

[bind_dns:children]
dns_authoritative
dns_resolvers
