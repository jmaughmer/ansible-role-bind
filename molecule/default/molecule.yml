---
# Three systemd containers (rootless Podman is fine) on one network,
# mirroring examples/:
#   ns-master  DNSSEC-signing primary, role-managed zones
#   ns-slave   secondary that transfers every zone from it
#   resolver   caching resolver forwarding example.test to the primary,
#              with DNS64 and dnstap export
# Run from the AlmaLinux-10 WSL distro with its rootless Podman.
# MOLECULE_EL_VERSION picks the AlmaLinux init image (default 10; also
# 8, 9) — see the README's "Testing" section.
#
# Inside containers SELinux is off and firewalld isn't installed, so this
# exercises the role's skip paths for both. Chroot and GeoIP have their own
# scenarios (molecule/chroot/, molecule/geoip/).

# meta/main.yml has no galaxy namespace; warn rather than fail on it.
role_name_check: 1

dependency:
  name: galaxy   # installs requirements.yml next to this file

driver:
  name: podman

# Instance names carry the scenario and EL release (bind-<scenario>-el<N>-
# <host>), so scenarios and releases can run side by side, also next to other
# projects' containers; inside, each keeps its short hostname. Playbooks and
# inventory/group_vars/ target the instances by group, not by name.
platforms:
  - name: bind-default-el${MOLECULE_EL_VERSION:-10}-ns-master
    hostname: ns-master
    groups: [ns_master]
    image: "docker.io/almalinux/${MOLECULE_EL_VERSION:-10}-init:latest"
    pre_build_image: true
    override_command: false   # keep the image's own CMD: systemd as PID 1
    systemd: always
    privileged: true          # lets systemd sandbox services (the dnstap converter)
    network: bind-default-el${MOLECULE_EL_VERSION:-10}   # created by the driver from the first platform

  - name: bind-default-el${MOLECULE_EL_VERSION:-10}-ns-slave
    hostname: ns-slave
    groups: [ns_slave]
    image: "docker.io/almalinux/${MOLECULE_EL_VERSION:-10}-init:latest"
    pre_build_image: true
    override_command: false
    systemd: always
    privileged: true
    network: bind-default-el${MOLECULE_EL_VERSION:-10}

  - name: bind-default-el${MOLECULE_EL_VERSION:-10}-resolver
    hostname: resolver
    groups: [resolver]
    image: "docker.io/almalinux/${MOLECULE_EL_VERSION:-10}-init:latest"
    pre_build_image: true
    override_command: false
    systemd: always
    privileged: true
    network: bind-default-el${MOLECULE_EL_VERSION:-10}

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: inventory/group_vars/
      shared.yml: ../shared-inventory.yml

verifier:
  name: ansible
