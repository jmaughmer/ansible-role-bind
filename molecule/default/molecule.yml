---
# Three KVM guests cloned from the lab's AlmaLinux templates, on the
# lab network, mirroring examples/:
#   ns-master  DNSSEC-signing primary, role-managed zones
#   ns-slave   secondary that transfers every zone from it
#   resolver   caching resolver forwarding example.test to the primary,
#              with DNS64 and dnstap export
# The full AlmaLinux templates run SELinux enforcing with firewalld
# installed, so the tests exercise the role's SELinux and firewalld paths
# rather than skip them.
# LAB_TEMPLATE picks the guest release (template-alma8/9/10, default alma10)
# — see the README's "Testing" section.

# meta/main.yml has no galaxy namespace; warn rather than fail on it.
role_name_check: 1

# Molecule runs the galaxy dependency through two installers: the roles one
# reads options["role-file"] (default <scenario>/requirements.yml) and the
# collections one options["requirements-file"] (default <scenario>/
# collections.yml). This scenario's file holds collections, so it's named
# explicitly — the same override the other scenarios use to reach
# molecule/default/requirements.yml. Without it, nothing here gets installed.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml

driver:
  # Clones full VMs from the templates; the PVE API endpoint and token come
  # from the secrets file. Everything lab-specific goes through environment
  # variables — nothing host-, subnet- or credential-shaped lives in here.
  name: molecule-proxmox
  options:
    proxmox_secrets: ${LAB_PROXMOX_SECRETS:-/root/.config/molecule/proxmox-secrets.yml}
    node: ${LAB_NODE:-galactica}
    validate_certs: false   # the lab's PVE uses its self-signed cert
    ssh_user: ${LAB_SSH_USER:-labadmin}
    ssh_identity_file: ${LAB_SSH_KEY:-/root/.ssh/id_ed25519}
    full: true              # full clones, not linked clones of the template
    pool: ${LAB_POOL:-testlab}
    timeout: 300

# VMIDs come from LAB_VMID_N — default 9200-9202, chroot 9203, geoip 9204,
# dnstap 9205 — bind's slice of the lab band map, so scenarios run side by
# side and a plain molecule test keeps its own VMs. The lab's `mlab` runner
# claims a free band per run (exporting LAB_VMID / LAB_VMID_0..2), which is
# what makes several runs of one scenario possible at the same time.
# Cloud-init names each VM after its instance name; playbooks and
# inventory/group_vars/ find instances by group, not by name.
platforms:
  - name: bind-default-ns-master
    groups: [ns_master]
    template_name: ${LAB_TEMPLATE:-template-alma10}
    newid: ${LAB_VMID_0:-9200}
  - name: bind-default-ns-slave
    groups: [ns_slave]
    template_name: ${LAB_TEMPLATE:-template-alma10}
    newid: ${LAB_VMID_1:-9201}
  - name: bind-default-resolver
    groups: [resolver]
    template_name: ${LAB_TEMPLATE:-template-alma10}
    newid: ${LAB_VMID_2:-9202}

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: inventory/group_vars/
      shared.yml: ../shared-inventory.yml

verifier:
  name: ansible
