---
# Caching resolver forwarding example.test to the primary, with DNS64,
# tuning options and dnstap export.
bind_dns_role: recursive
# dnstap and validate-except need BIND 9.12+/9.13.3+: on EL8 that means bind9.16.
bind_use_bind9_16: "{{ ansible_facts['distribution_major_version'] | int == 8 }}"
bind_acls:
  trusted: [127.0.0.1, "::1"]
  transfer_hosts: []
  # The primary may recurse here; the secondary deliberately may not, so
  # verify.yml can check that it's REFUSED.
  recursion_clients: [127.0.0.0/8, "::1", "{{ test_master_ip }}"]
  dns64_clients: [127.0.0.0/8, "::1"]
# example.test isn't delegated from the real root, which proves it doesn't
# exist, so validating the forwarded answers would fail. Exempt it, leaving
# validation (auto) on for everything else.
bind_dnssec_validate_except: [example.test]
bind_dns64_enabled: true
# A list: the ACL plus a literal network and a negated one, so named has to
# accept every kind of element. Loopback still gets DNS64 through the ACL.
bind_dns64_clients_acl: [dns64_clients, 198.51.100.0/24, "!203.0.113.0/24"]
bind_dns64_options:
  exclude: ["::ffff:0:0/96"]
  recursive-only: false
bind_max_cache_size: 256m
bind_recursive_clients: 2000
bind_log_buffered: true
bind_dnstap_enabled: true
bind_dnstap_export_enabled: true
bind_zones:
  - name: example.test
    type: forward
    forwarders: ["{{ test_master_ip }}"]
