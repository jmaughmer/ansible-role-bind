---
# The almalinux/N-init images are minimal: no sudo (which become needs) and
# no iproute (which fact gathering needs for ansible_default_ipv4, how the
# servers find each other). Install both with raw, which needs no Python on
# the host.
#
# ansible-core 2.17+ also can't manage hosts whose only Python is 3.6 —
# RHEL 8's default /usr/bin/python3. On EL8, install Python 3.11 from
# AppStream too; Ansible's interpreter discovery then picks it over 3.6.
# Real RHEL 8 hosts managed by a current ansible-core need the same (see the
# README's "Requirements").
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install sudo, iproute, and Python 3.11 on EL8 hosts
      # Explicit /bin/sh -c: the podman connection runs raw commands without
      # a shell, so a bare "if ..." would be taken as a program name.
      ansible.builtin.raw: >-
        /bin/sh -c "pkgs='sudo iproute';
        grep -q ' release 8' /etc/redhat-release && pkgs=\"$pkgs python3.11\";
        if ! rpm -q --quiet $pkgs; then dnf -y -q install $pkgs && echo installed; fi"
      register: base_packages
      changed_when: "'installed' in base_packages.stdout"
