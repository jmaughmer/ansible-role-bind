---
# One authoritative server with GeoIP2 enabled, checking that a geoip ACL
# actually matches by country: geo.test may only be transferred by clients
# in GB. prepare.yml installs MaxMind's public GeoLite2-Country *test*
# database (fixed, documented test networks — no MaxMind account needed)
# and gives the guest one address from a GB test network and one from an
# SE one; verify.yml then tries AXFR from each.
#   molecule test -s geoip
# LAB_TEMPLATE picks the guest release, as in the default scenario.
# geoipupdate itself isn't exercised: it needs real MaxMind credentials.
role_name_check: 1

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../default/requirements.yml

driver:
  # Same lab driver and env variables as the default scenario.
  name: molecule-proxmox
  options:
    proxmox_secrets: ${LAB_PROXMOX_SECRETS:-/root/.config/molecule/proxmox-secrets.yml}
    node: ${LAB_NODE:-galactica}
    validate_certs: true    # galactica serves a valid Let's Encrypt cert (ACME) on its FQDN
    ssh_user: ${LAB_SSH_USER:-labadmin}
    ssh_identity_file: ${LAB_SSH_KEY:-/root/.ssh/id_ed25519}
    full: ${LAB_FULL:-true}
    pool: ${LAB_POOL:-testlab}
    timeout: ${LAB_TIMEOUT:-300}

# VMID 9204 (LAB_VMID) — bind's band continues 9200-9205 across scenarios
# (see the default scenario); a plain molecule test uses the pinned VMID,
# mlab claims a free one per run. Playbooks and inventory/group_vars/ target
# the instance by group, not by name.
platforms:
  - name: bind-geoip-ns-geoip
    groups: [ns_geoip]
    template_name: ${LAB_TEMPLATE:-template-alma10}
    newid: ${LAB_VMID:-9204}

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: inventory/group_vars/
      shared.yml: ../shared-inventory.yml

verifier:
  name: ansible
