---
# One authoritative server with GeoIP2 enabled, checking that a geoip ACL
# actually matches by country: geo.test may only be transferred by clients
# in GB. prepare.yml installs MaxMind's public GeoLite2-Country *test*
# database (fixed, documented test networks — no MaxMind account needed)
# and gives the container one address from a GB test network and one from
# an SE one; verify.yml then tries AXFR from each.
#   molecule test -s geoip
# MOLECULE_EL_VERSION picks the AlmaLinux release, as in the default scenario.
# geoipupdate itself isn't exercised: it needs real MaxMind credentials.
role_name_check: 1

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../default/requirements.yml

driver:
  name: podman

platforms:
  - name: ns-geoip
    image: "docker.io/almalinux/${MOLECULE_EL_VERSION:-10}-init:latest"
    pre_build_image: true
    override_command: false   # keep the image's own CMD: systemd as PID 1
    systemd: always
    privileged: true          # lets prepare.yml add the test addresses

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: ../default/inventory/group_vars/
      host_vars: inventory/host_vars/

verifier:
  name: ansible
