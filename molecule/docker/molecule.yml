---
# Same test as the default (Podman) scenario, on Docker: same instances,
# playbooks, inventory and zones.d, all taken from ../default/.
#   molecule test -s docker
role_name_check: 1

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../default/requirements.yml

driver:
  name: docker

platforms:
  - name: ns-master
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    pre_build_image: true
    override_command: false   # keep the image's own CMD: systemd as PID 1
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    docker_networks:          # created once, shared by all three instances
      - name: bind_dns_molecule
    networks:
      - name: bind_dns_molecule

  - name: ns-slave
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    pre_build_image: true
    override_command: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      - name: bind_dns_molecule

  - name: resolver
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    pre_build_image: true
    override_command: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      - name: bind_dns_molecule

provisioner:
  name: ansible
  playbooks:
    prepare: ../default/prepare.yml
    converge: ../default/converge.yml
    verify: ../default/verify.yml
  inventory:
    links:
      group_vars: ../default/inventory/group_vars/
      host_vars: ../default/inventory/host_vars/

verifier:
  name: ansible
