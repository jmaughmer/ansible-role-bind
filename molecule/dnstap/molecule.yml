---
# dnstap capture and its Elasticsearch export, in depth, on one
# authoritative server (the default scenario only checks one answer gets
# through on the resolver). verify.yml:
#   1. drives real queries through named and checks the exported JSON
#      field by field, its ownership/mode, and that a re-run adds nothing;
#   2. runs the converter on prepared dnstap files under the host's own
#      Python (platform-python 3.6 on EL8): name compression, TXT escaping,
#      RRSIG, IPv6/TCP, a truncated file, skipped files, output rotation,
#      and answer latency from pairing queries with responses (within a
#      file, and across runs through the state file);
#   3. turns the export off and checks the timer, units and script go while
#      the capture and already-exported JSON stay;
#   4. on EL8, checks enabling dnstap on base BIND 9.11 fails with its
#      explanation.
#   molecule test -s dnstap
# LAB_TEMPLATE picks the guest release, as in the default scenario.
# The shared prepare runs through this scenario's prepare.yml.
role_name_check: 1

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../default/requirements.yml

driver:
  # Same lab driver and env variables as the default scenario.
  name: molecule-proxmox
  options:
    proxmox_secrets: ${LAB_PROXMOX_SECRETS:-/root/.config/molecule/proxmox-secrets.yml}
    node: ${LAB_NODE:-galactica}
    validate_certs: false   # the lab's PVE uses its self-signed cert
    ssh_user: ${LAB_SSH_USER:-labadmin}
    ssh_identity_file: ${LAB_SSH_KEY:-/root/.ssh/id_ed25519}
    full: ${LAB_FULL:-true}
    pool: ${LAB_POOL:-testlab}
    timeout: 300

# VMID 9205 (LAB_VMID) — bind's band continues 9200-9205 across scenarios
# (see the default scenario); a plain molecule test uses the pinned VMID,
# mlab claims a free one per run. Playbooks and inventory/group_vars/ target
# the instance by group, not by name.
platforms:
  - name: bind-dnstap-ns-dnstap
    groups: [ns_dnstap]
    template_name: ${LAB_TEMPLATE:-template-alma10}
    newid: ${LAB_VMID:-9205}

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: inventory/group_vars/
      shared.yml: ../shared-inventory.yml

verifier:
  name: ansible
