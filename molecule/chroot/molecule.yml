---
# One server switched from plain named.service to named-chroot, the way an
# existing host would be: prepare.yml deploys the role with chroot off,
# then converge.yml turns it on. verify.yml checks named really runs inside
# /var/named/chroot, that the role's bind mounts are in place, and that
# signing, query logging and dnstap all still work through them.
#   molecule test -s chroot
# LAB_TEMPLATE picks the guest release, as in the default scenario.
role_name_check: 1

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../default/requirements.yml

driver:
  # Same lab driver and env variables as the default scenario.
  name: molecule-proxmox
  options:
    proxmox_secrets: ${LAB_PROXMOX_SECRETS:-/root/.config/molecule/proxmox-secrets.yml}
    node: ${LAB_NODE:-pve}
    validate_certs: false   # the lab's PVE uses its self-signed cert
    ssh_user: ${LAB_SSH_USER:-labadmin}
    ssh_identity_file: ${LAB_SSH_KEY:-/root/.ssh/id_ed25519}
    full: true
    pool: ${LAB_POOL:-testlab}
    timeout: 300

# VMID 9220 — this scenario's slice of the lab's VMIDs (see the default
# scenario); one run at a time. Playbooks and inventory/group_vars/ target
# the instance by group, not by name.
platforms:
  - name: bind-chroot-ns-chroot
    groups: [ns_chroot]
    template_name: ${LAB_TEMPLATE:-template-alma10}
    newid: 9220

provisioner:
  name: ansible
  env:
    # Decrypts the test rndc key in group_vars/ns_chroot.yml.
    ANSIBLE_VAULT_PASSWORD_FILE: ${MOLECULE_SCENARIO_DIRECTORY}/vault-password.sh
  inventory:
    links:
      group_vars: inventory/group_vars/
      shared.yml: ../shared-inventory.yml

verifier:
  name: ansible
