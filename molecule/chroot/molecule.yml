---
# One server switched from plain named.service to named-chroot, the way an
# existing host would be: prepare.yml deploys the role with chroot off,
# then converge.yml turns it on. verify.yml checks named really runs inside
# /var/named/chroot, that the role's bind mounts are in place, and that
# signing, query logging and dnstap all still work through them.
#   molecule test -s chroot
# MOLECULE_EL_VERSION picks the AlmaLinux release, as in the default scenario.
#
# In a rootless container, named-chroot's setup script can't create the
# chroot's /dev nodes (mknod isn't allowed in a user namespace), so
# /var/named/chroot/dev stays empty here, unlike on a real host. named
# runs fine without them.
role_name_check: 1

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../default/requirements.yml

driver:
  name: podman

# Instance names carry the scenario and EL release (bind-<scenario>-el<N>-
# <host>), so scenarios and releases can run side by side, also next to other
# projects' containers; inside, each keeps its short hostname. Playbooks and
# inventory/group_vars/ target the instances by group, not by name.
platforms:
  - name: bind-chroot-el${MOLECULE_EL_VERSION:-10}-ns-chroot
    hostname: ns-chroot
    groups: [ns_chroot]
    image: "docker.io/almalinux/${MOLECULE_EL_VERSION:-10}-init:latest"
    pre_build_image: true
    override_command: false   # keep the image's own CMD: systemd as PID 1
    systemd: always
    privileged: true          # named-chroot's setup bind-mounts paths into the chroot

provisioner:
  name: ansible
  env:
    # Decrypts the test rndc key in group_vars/ns_chroot.yml.
    ANSIBLE_VAULT_PASSWORD_FILE: ${MOLECULE_SCENARIO_DIRECTORY}/vault-password.sh
  inventory:
    links:
      group_vars: inventory/group_vars/
      shared.yml: ../shared-inventory.yml

verifier:
  name: ansible
