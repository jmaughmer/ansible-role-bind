---
# Chrooted, DNSSEC-signing primary — the shape of examples/'s internet-facing
# master. Signing keys, query logs and dnstap output all get written from
# inside the chroot, through its bind mounts.
bind_dns_role: authoritative
bind_chroot_enabled: true                   # prepare.yml overrides this to false
bind_chroot_extra_paths: [/srv/named-extra]  # created by prepare.yml
bind_acls:
  trusted: [127.0.0.1, "::1"]
  transfer_hosts: []
  recursion_clients: []
  dns64_clients: []
bind_dnssec_enable_signing: true            # on EL8 this also switches to bind9.16
# A supplied, vault-encrypted rndc key replacing the generated one
# prepare.yml started with. Test-only: vault-password.sh, beside
# molecule.yml, prints its password.
bind_rndc_key_name: molecule-rndc
bind_rndc_key_secret: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  64343861366235623564323039613566663038643632636663376333303930343738613466626437
  3438343266636634356234653231316236613864353530610a316438356338636234613862346434
  36666235626230373036613864653637643533663731336332656435653737633532396564666135
  3365666564626163390a393362363566666163396665663963323634336263373361333435393966
  38356537333964393234306635666239303663353630323331363734303535373835353139313933
  61323535666132333861353932383262376334656430323864366463363137643934643433393633
  313632303735383865626335323832626232
bind_dnstap_enabled: true
# Consolidated log *and* per-category files (switched from prepare.yml's
# per-category-only layout), with the query log kept out of the shipped
# named.log, and named.log rolled on its own settings.
bind_log_consolidated: true
bind_log_individual_files: true
bind_log_consolidated_exclude: [queries]
bind_log_consolidated_size: 50m
bind_log_consolidated_versions: 4
bind_zones:
  - name: chroot.test
    type: master
    dnssec: true
    primary_ns: ns1.chroot.test
    nameservers: [ns1.chroot.test]
    records:
      - { name: ns1, type: A, value: 10.153.54.10 }
      - { name: www, type: A, value: 10.153.54.20 }
