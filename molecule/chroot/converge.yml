---
# prepare.yml left plain named.service running; this switches the host to
# named-chroot. The role is included by the repository's path (see the
# default scenario's converge.yml).
- name: Converge
  hosts: all
  become: true
  tasks:
    - name: Apply the role with chroot on
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
