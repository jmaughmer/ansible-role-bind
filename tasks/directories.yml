---
- name: Create BIND working directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ bind_user }}"
    group: "{{ bind_group }}"
    mode: "{{ item.mode | default('0750') }}"
  loop:
    - path: "{{ bind_conf_dir }}"
    - path: "{{ bind_zones_dir }}"
    - path: "{{ bind_slave_zones_dir }}"
    - path: "{{ bind_dnssec_keys_dir }}"
    # The bind package ships these two (/var/named/data, /var/named/dynamic
    # by default) as 0770, and RPM puts that mode back whenever a bind
    # package is installed or upgraded — installing bind-chroot does it too —
    # so match it rather than flip it on every such run.
    - { path: "{{ bind_stats_dir }}", mode: "0770" }
    - { path: "{{ bind_managed_keys_dir }}", mode: "0770" }
  loop_control:
    label: "{{ item.path }}"

- name: Create BIND log directory
  ansible.builtin.file:
    path: "{{ bind_log_dir }}"
    state: directory
    owner: "{{ bind_user }}"
    group: "{{ bind_group }}"
    mode: "0750"
